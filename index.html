<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070d1a" />
  <title>Đại Chiến Manga — MOBA 5v5 Chibi</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --bg-deep: #050a14;
      --panel-bg: rgba(9, 18, 34, 0.92);
      --panel-border: rgba(232, 193, 112, 0.42);
      --gold: #f0c76b;
      --gold-bright: #ffe59e;
      --cyan: #38bdf8;
      --crimson: #ef4444;
      --emerald: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #102344 0%, #060c18 68%, #03060c 100%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(6, 14, 28, 0.94) 0%, rgba(6, 14, 28, 0.45) 50%, rgba(4, 9, 19, 0.96) 100%);
    }

    /* Thanh trên cùng phong cách HUD MOBA */
    .hud-top {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 12px;
      background: linear-gradient(90deg, rgba(11, 22, 42, 0.95) 0%, rgba(20, 35, 64, 0.92) 50%, rgba(11, 22, 42, 0.95) 100%);
      border-bottom: 1px solid var(--panel-border);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
      flex-shrink: 0;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 12px rgba(240, 199, 107, 0.35);
      white-space: nowrap;
    }

    .match-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 28, 52, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
    }

    .dark-dragon-badge {
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
      border: 1px solid rgba(168, 85, 247, 0.5);
      background: rgba(59, 7, 100, 0.45);
      color: #e9d5ff;
      white-space: nowrap;
    }

    .dark-dragon-badge.active {
      background: linear-gradient(135deg, #7e22ce, #dc2626);
      border-color: #fda4af;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(225, 29, 72, 0.6);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .top-actions::-webkit-scrollbar {
      display: none;
    }

    .hud-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(240, 199, 107, 0.42);
      background: linear-gradient(180deg, rgba(30, 48, 82, 0.95), rgba(14, 24, 44, 0.95));
      color: var(--gold-bright);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .hud-btn:active {
      transform: scale(0.96);
    }

    .hud-btn.install-btn {
      border-color: rgba(56, 189, 248, 0.65);
      color: #bae6fd;
      background: linear-gradient(180deg, rgba(14, 68, 106, 0.95), rgba(9, 36, 62, 0.95));
    }

    /* Thanh chọn 50 tướng Chibi */
    .hero-strip-wrap {
      position: relative;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: rgba(7, 15, 29, 0.88);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      flex-shrink: 0;
    }

    .active-hero-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 6px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(240, 199, 107, 0.2), rgba(56, 189, 248, 0.14));
      border: 1px solid var(--gold);
      flex-shrink: 0;
    }

    .chibi-avatar-box {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(9, 18, 36, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .active-hero-chip strong {
      display: block;
      font-size: 12px;
      color: var(--gold-bright);
      line-height: 1.15;
    }

    .active-hero-chip span {
      display: block;
      font-size: 10px;
      color: var(--cyan);
      font-weight: 700;
    }

    .hero-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(240, 199, 107, 0.4) transparent;
    }

    .hero-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px 4px 5px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(15, 27, 48, 0.9);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }

    .hero-card-btn .mini-chibi {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 12, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .hero-card-btn.selected {
      color: #09111e;
      background: linear-gradient(180deg, #ffe59e, #e5b44c);
      border-color: #fff3c4;
      box-shadow: 0 0 12px rgba(240, 199, 107, 0.55);
    }

    .hero-card-btn.selected .mini-chibi {
      background: rgba(255, 255, 255, 0.35);
      border-color: rgba(9, 17, 30, 0.35);
    }

    /* Khu vực bản đồ chiến trường */
    .arena-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
    }

    #mobaCanvas {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      border-radius: 14px;
      border: 1.5px solid rgba(240, 199, 107, 0.38);
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.65),
        inset 0 0 28px rgba(56, 189, 248, 0.08);
      background: #091726;
    }

    .target-hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(8, 15, 29, 0.9);
      border: 1px solid rgba(239, 68, 68, 0.55);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .target-hud .t-name {
      font-size: 12px;
      font-weight: 800;
      color: #fca5a5;
    }

    .hp-bar-track {
      width: 120px;
      height: 9px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.95);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #f97316);
      transition: width 0.14s ease;
    }

    .hp-bar-fill.execute-zone {
      background: linear-gradient(90deg, #dc2626, #c026d3);
      box-shadow: 0 0 10px #e879f9;
    }

    .target-hud .t-hp {
      font-size: 11px;
      font-weight: 800;
      color: #f8fafc;
      min-width: 56px;
      text-align: right;
    }

    /* Cụm điều khiển trái & phải kiểu MOBA */
    .controls-overlay {
      position: absolute;
      inset: 0;
      z-index: 14;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 14px 18px;
    }

    .dpad-cluster {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 4px;
      padding: 6px;
      border-radius: 22px;
      background: rgba(8, 17, 34, 0.72);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(6px);
    }

    .dpad-btn {
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.32);
      background: linear-gradient(180deg, rgba(25, 45, 78, 0.92), rgba(11, 21, 40, 0.95));
      color: #e2e8f0;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    }

    .dpad-btn:active,
    .dpad-btn.pressed {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #05111f;
      border-color: #bae6fd;
      transform: scale(0.94);
    }

    .dpad-center {
      border-radius: 50%;
      border: 1px solid rgba(240, 199, 107, 0.35);
      background: radial-gradient(circle, rgba(240, 199, 107, 0.22), rgba(10, 20, 38, 0.75));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: var(--gold);
    }

    .skill-cluster {
      pointer-events: auto;
      position: relative;
      width: 196px;
      height: 168px;
    }

    .skill-btn {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(240, 199, 107, 0.65);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
      transition: transform 0.1s ease, filter 0.12s ease;
    }

    .skill-btn:active {
      transform: scale(0.92);
    }

    .skill-btn.cd {
      filter: grayscale(0.65) brightness(0.65);
    }

    .skill-btn .cd-tag {
      font-size: 10px;
      font-weight: 800;
      color: #fde68a;
      margin-top: 2px;
    }

    .btn-atk {
      width: 78px;
      height: 78px;
      right: 6px;
      bottom: 6px;
      font-size: 13px;
      border-color: #fde047;
      background: radial-gradient(circle at 35% 30%, #f59e0b, #b45309 75%);
    }

    .btn-s1 {
      width: 56px;
      height: 56px;
      left: 26px;
      bottom: 12px;
      font-size: 12px;
      border-color: #7dd3fc;
      background: radial-gradient(circle at 35% 30%, #38bdf8, #0369a1 75%);
    }

    .btn-s2 {
      width: 56px;
      height: 56px;
      left: 16px;
      top: 24px;
      font-size: 12px;
      border-color: #86efac;
      background: radial-gradient(circle at 35% 30%, #22c55e, #15803d 75%);
    }

    .btn-ulti {
      width: 62px;
      height: 62px;
      right: 14px;
      top: 4px;
      font-size: 11px;
      border-color: #fda4af;
      background: radial-gradient(circle at 35% 30%, #f43f5e, #9f1239 75%);
    }

    /* Toast thông báo chiến thuật */
    .combat-toast {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 16;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(11, 20, 38, 0.92);
      border: 1px solid rgba(240, 199, 107, 0.5);
      color: var(--gold-bright);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    /* Modal hệ thống phong cách thẻ MOBA */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(3, 7, 15, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 620px;
      max-height: 84vh;
      overflow-y: auto;
      border-radius: 16px;
      background: linear-gradient(180deg, #10203c 0%, #091224 100%);
      border: 1.5px solid var(--panel-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      padding: 18px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(240, 199, 107, 0.25);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 17px;
      color: var(--gold-bright);
    }

    .close-modal-btn {
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      font-weight: 700;
      cursor: pointer;
    }

    .dragon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .dragon-tile {
      padding: 10px;
      border-radius: 10px;
      background: rgba(15, 29, 54, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .dragon-tile.slain {
      border-color: var(--gold);
      background: rgba(240, 199, 107, 0.14);
    }

    .dragon-tile strong {
      display: block;
      font-size: 13px;
      color: var(--gold-bright);
      margin-bottom: 4px;
    }

    .dragon-tile p {
      margin: 0;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(24, 14, 42, 0.72);
      border: 1px solid rgba(192, 132, 252, 0.45);
      margin-bottom: 12px;
    }

    .action-primary {
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid var(--gold);
      background: linear-gradient(180deg, #f6cf76, #d49b2a);
      color: #09111e;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .rank-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .rank-item {
      padding: 9px 10px;
      border-radius: 10px;
      background: rgba(15, 28, 52, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.22);
      font-size: 12px;
    }

    .rank-item.current {
      border-color: var(--gold);
      background: rgba(240, 199, 107, 0.16);
      box-shadow: 0 0 12px rgba(240, 199, 107, 0.25);
    }

    .rank-item strong {
      display: block;
      color: var(--gold-bright);
    }

    .rank-item span {
      font-size: 11px;
      color: var(--text-muted);
    }

    pre.code-box {
      margin: 0;
      padding: 12px;
      border-radius: 10px;
      background: #050a14;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #bae6fd;
      font-size: 12px;
      overflow-x: auto;
      line-height: 1.5;
    }

    @media (max-width: 680px) {
      .brand-title {
        font-size: 11px;
      }
      .dpad-cluster {
        grid-template-columns: repeat(3, 42px);
        grid-template-rows: repeat(3, 42px);
      }
      .skill-cluster {
        width: 170px;
        height: 148px;
      }
      .btn-atk {
        width: 68px;
        height: 68px;
      }
      .btn-s1, .btn-s2 {
        width: 48px;
        height: 48px;
      }
      .btn-ulti {
        width: 54px;
        height: 54px;
      }
      .hp-bar-track {
        width: 84px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- HUD trên cùng kiểu Liên Quân -->
    <header class="hud-top">
      <div class="brand-block">
        <div class="brand-title">⚔️ ĐẠI CHIẾN MANGA CHIBI</div>
        <div class="match-pill" id="rankHud">Hạng: Đồng • IV ★0</div>
        <div class="dark-dragon-badge" id="darkDragonHud">🐉 Rồng Nguyên Tố: 0/3</div>
      </div>

      <div class="top-actions">
        <button class="hud-btn" id="btnDragonModal">Rồng &amp; Bùa</button>
        <button class="hud-btn" id="btnRankModal">13 Bậc Hạng</button>
        <button class="hud-btn" id="btnPackModal">Đóng Gói App</button>
        <button class="hud-btn install-btn" id="btnInstallApp">Cài Ứng Dụng</button>
      </div>
    </header>

    <!-- Thanh chọn 50 tướng Chibi -->
    <section class="hero-strip-wrap">
      <div class="active-hero-chip">
        <div class="chibi-avatar-box" id="activeHeroAvatar"></div>
        <div>
          <strong id="activeHeroName">1. Akame</strong>
          <span id="activeHeroRole">Sát Thủ • Chibi</span>
        </div>
      </div>
      <div class="hero-scroll" id="heroScrollList"></div>
    </section>

    <!-- Bản đồ 3 đường kiểu LMHT & điều khiển MOBA -->
    <main class="arena-stage">
      <div class="target-hud">
        <span class="t-name" id="targetName">🎯 Địch: Goku (Chibi)</span>
        <div class="hp-bar-track">
          <div class="hp-bar-fill" id="targetHpFill"></div>
        </div>
        <span class="t-hp" id="targetHpText">1000/1000</span>
      </div>

      <canvas id="mobaCanvas" width="1200" height="620"></canvas>

      <div class="controls-overlay">
        <!-- Cụm phím di chuyển góc dưới bên trái -->
        <div class="dpad-cluster" aria-label="Điều khiển di chuyển">
          <div></div>
          <button class="dpad-btn" data-dir="up" aria-label="Lên">▲</button>
          <div></div>
          <button class="dpad-btn" data-dir="left" aria-label="Trái">◀</button>
          <div class="dpad-center">LMHT</div>
          <button class="dpad-btn" data-dir="right" aria-label="Phải">▶</button>
          <div></div>
          <button class="dpad-btn" data-dir="down" aria-label="Xuống">▼</button>
          <div></div>
        </div>

        <!-- Cụm kỹ năng & đòn đánh góc dưới bên phải -->
        <div class="skill-cluster" aria-label="Kỹ năng chiến đấu">
          <button class="skill-btn btn-s2" id="btnS2">
            <span>S2</span>
