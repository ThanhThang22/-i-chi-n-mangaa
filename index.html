<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#d97706" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Đại Chiến Manga" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon-192.svg" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <title>Đại Chiến Manga</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #060911; color: #f8fafc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .app-shell { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0b1120 55%, #060911 100%); }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(245, 158, 11, 0.35); gap: 8px; flex-wrap: wrap; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand-name { font-size: 16px; font-weight: 800; color: #fbbf24; }
    .brand-meta { font-size: 11px; color: #94a3b8; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn { background: rgba(30, 41, 59, 0.92); color: #f8fafc; border: 1px solid rgba(251, 191, 36, 0.4); padding: 7px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #090d16; border: none; }
    .viewport { position: relative; flex: 1; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
    .hud-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .panel { pointer-events: auto; background: rgba(15, 23, 42, 0.84); backdrop-filter: blur(8px); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px; padding: 10px 12px; max-width: 450px; }
    .panel h2 { font-size: 13px; color: #fbbf24; margin-bottom: 4px; }
    .panel p { font-size: 12px; color: #cbd5e1; line-height: 1.4; }
    .heroes { pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; max-width: 56vw; padding-bottom: 4px; }
    .h-chip { background: rgba(30, 41, 59, 0.92); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.28); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .h-chip.active { background: #f59e0b; color: #090d16; border-color: #fde68a; }
    .hud-bottom { pointer-events: auto; display: flex; justify-content: space-between; align-items: flex-end; }
    .dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; }
    .dpad button { background: rgba(30, 41, 59, 0.92); border: 1px solid rgba(148, 163, 184, 0.35); color: #fff; border-radius: 10px; font-weight: 800; cursor: pointer; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .cast { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #fbbf24; background: rgba(15, 23, 42, 0.92); color: #fbbf24; font-weight: 900; font-size: 11px; cursor: pointer; }
    .cast.ulti { width: 62px; height: 62px; border-color: #f97316; color: #fdba74; }
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.8); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
    .sheet-backdrop.open { display: flex; }
    .sheet { background: #0f172a; border: 1px solid rgba(251, 191, 36, 0.45); border-radius: 14px; padding: 18px; width: 100%; max-width: 540px; max-height: 85vh; overflow-y: auto; }
    .sheet h3 { color: #fbbf24; font-size: 16px; margin-bottom: 10px; }
    .sheet pre { background: #020617; padding: 12px; border-radius: 8px; font-size: 11px; color: #e2e8f0; overflow-x: auto; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="icon-192.svg" alt="Đại Chiến Manga" />
        <div>
          <div class="brand-name">Đại Chiến Manga</div>
          <div class="brand-meta" id="rankSummary">Sắt Bậc 4 • 0★ • 50 Tướng</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-gold" id="installAppBtn">Cài Ứng Dụng</button>
        <button class="btn" id="dragonBtn">Rồng &amp; Bùa</button>
        <button class="btn" id="rankModalBtn">13 Bậc Hạng</button>
        <button class="btn" id="exportGuideBtn">Đóng Gói App</button>
      </div>
    </header>

    <main class="viewport">
      <canvas id="arena"></canvas>
      <div class="hud">
        <div class="hud-top">
          <div class="panel">
            <h2 id="heroInfo">Tướng: Luffy • Rồng: 0/3</h2>
            <p id="battleLog">Bản đồ ngang 3 đường • Trụ &amp; Nhà Chính đã bố trí sẵn • Bùa Rồng Hắc Ám kết liễu ngay lập tức khi gây sát thương tướng đích làm/khi máu dưới 20%.</p>
          </div>
          <div class="heroes" id="heroList"></div>
        </div>
        <div class="hud-bottom">
          <div class="dpad">
            <div></div>
            <button data-dx="0" data-dy="-1">▲</button>
            <div></div>
            <button data-dx="-1" data-dy="0">◀</button>
            <button data-dx="0" data-dy="1">▼</button>
            <button data-dx="1" data-dy="0">▶</button>
          </div>
          <div class="actions">
            <button class="cast" id="actAtk">ĐÁNH</button>
            <button class="cast" id="actS1">S1</button>
            <button class="cast" id="actS2">S2</button>
            <button class="cast ulti" id="actUlti">ULTI</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <h3 id="sheetTitle">Thông Tin</h3>
      <div id="sheetBody"></div>
      <div style="margin-top:14px; text-align:right;">
        <button class="btn btn-gold" id="closeSheet">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    const APP_TITLE = "Đại Chiến Manga";
    const RANKS = [
      "Sắt", "Đồng", "Bạc", "Vàng", "Bạch Kim", "Lục Bảo", "Kim Cương",
      "Tinh Anh", "Cao Thủ", "Đại Cao Thủ", "Chiến Tướng", "Đại Chiến Tướng", "Bất Bại"
    ];
    const HEROES = [
      "Luffy", "Naruto", "Doraemon", "Goku", "Gojo", "Tanjiro", "Zoro", "Sasuke",
      "Sakura", "Levi", "Mikasa", "Denji", "Pochita", "Ichigo", "Rukia", "Gon",
      "Killua", "Hisoka", "Saitama", "Genos", "Deku", "Bakugo", "Todoroki", "All Might",
      "Shanks", "Kaido", "Law", "Sanji", "Nami", "Robin", "Kakashi", "Itachi",
      "Madara", "Gaara", "Minato", "Sukuna", "Megumi", "Nobara", "Nezuko", "Zenitsu",
      "Rengoku", "Giyu", "Asta", "Yuno", "Lelouch", "Light", "Edward", "Alphonse",
      "Triệu Vân", "Lữ Bố"
    ];

    const appState = JSON.parse(localStorage.getItem("dcm_v1_app_state") || JSON.stringify({
      hero: "Luffy",
      rankIdx: 0,
      tier: 4,
      stars: 0,
      dragonCount: 0,
      darkDragonBuff: false
    }));

    function persist() {
      localStorage.setItem("dcm_v1_app_state", JSON.stringify(appState));
      renderMeta();
    }

    function renderMeta() {
      document.getElementById("rankSummary").textContent =
        `${RANKS[appState.rankIdx]} Bậc ${appState.tier} • ${appState.stars}★ • ${HEROES.length} Tướng`;
      document.getElementById("heroInfo").textContent =
        `Tướng: ${appState.hero} • ${appState.darkDragonBuff ? "Bùa Rồng Hắc Ám ĐANG BẬT" : "Rồng: " + appState.dragonCount + "/3"}`;
    }

    const heroListEl = document.getElementById("heroList");
    HEROES.forEach((h) => {
      const btn = document.createElement("button");
      btn.className = "h-chip" + (appState.hero === h ? " active" : "");
      btn.textContent = h;
      btn.onclick = () => {
        appState.hero = h;
        document.querySelectorAll(".h-chip").forEach((el) => el.classList.remove("active"));
        btn.classList.add("active");
        persist();
      };
      heroListEl.appendChild(btn);
    });

    const canvas = document.getElementById("arena");
    const ctx = canvas.getContext("2d");
    const player = { x: 0.22, y: 0.5 };
    const enemy = { x: 0.78, y: 0.5, hp: 100, maxHp: 100 };
    let dir = { x: 0, y: 0 };
    let beams = [];

    function fitCanvas() {
      const r = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(320, Math.floor(r.width * window.devicePixelRatio));
      canvas.height = Math.max(200, Math.floor(r.height * window.devicePixelRatio));
    }
    window.addEventListener("resize", fitCanvas);
    fitCanvas();

    document.querySelectorAll(".dpad button[data-dx]").forEach((b) => {
      const down = () => { dir.x = Number(b.dataset.dx); dir.y = Number(b.dataset.dy); };
      const up = () => { dir.x = 0; dir.y = 0; };
      b.addEventListener("pointerdown", down);
      b.addEventListener("pointerup", up);
      b.addEventListener("pointerleave", up);
    });

    function hitTarget(dmg, isDirectHeroDamage) {
      const px = player.x * canvas.width;
      const py = player.y * canvas.height;
      const ex = enemy.x * canvas.width;
      const ey = enemy.y * canvas.height;
      beams.push({ x1: px, y1: py, x2: ex, y2: ey, ttl: 18, color: isDirectHeroDamage ? "#fbbf24" : "#38bdf8" });

      if (isDirectHeroDamage) {
        enemy.hp = Math.max(0, enemy.hp - dmg);
        if (appState.darkDragonBuff && enemy.hp > 0 && enemy.hp < enemy.maxHp * 0.2) {
          enemy.hp = 0;
          beams.push({ x1: ex - 26, y1: ey - 26, x2: ex + 26, y2: ey + 26, ttl: 28, color: "#ef4444" });
          document.getElementById("battleLog").textContent =
            "Bùa Rồng Hắc Ám kích hoạt: Sát thương tướng đích đưa máu dưới 20% → Kết liễu ngay lập tức!";
        }
        if (enemy.hp === 0) {
          appState.stars = Math.min(5, appState.stars + 1);
          enemy.hp = enemy.maxHp;
          persist();
        }
      }
    }

    document.getElementById("actAtk").onclick = () => hitTarget(12, true);
    document.getElementById("actS1").onclick = () => hitTarget(18, true);
    document.getElementById("actS2").onclick = () => hitTarget(15, true);
    document.getElementById("actUlti").onclick = () => hitTarget(28, true);

    function loop() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#0e291b";
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "#b5894c";
      ctx.lineWidth = Math.max(12, h * 0.06);
      ctx.beginPath();
      ctx.moveTo(w * 0.12, h * 0.18); ctx.lineTo(w * 0.88, h * 0.18);
      ctx.moveTo(w * 0.12, h * 0.50); ctx.lineTo(w * 0.88, h * 0.50);
      ctx.moveTo(w * 0.12, h * 0.82); ctx.lineTo(w * 0.88, h * 0.82);
      ctx.stroke();

      const towers = [
        [0.24, 0.18, "#38bdf8"], [0.36, 0.18, "#38bdf8"],
        [0.26, 0.50, "#38bdf8"], [0.38, 0.50, "#38bdf8"],
        [0.24, 0.82, "#38bdf8"], [0.36, 0.82, "#38bdf8"],
        [0.64, 0.18, "#f87171"], [0.76, 0.18, "#f87171"],
        [0.62, 0.50, "#f87171"], [0.74, 0.50, "#f87171"],
        [0.64, 0.82, "#f87171"], [0.76, 0.82, "#f87171"]
      ];
      towers.forEach(([tx, ty, col]) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(tx * w, ty * h, Math.max(7, w * 0.011), 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = "#2563eb";
      ctx.fillRect(w * 0.08, h * 0.43, w * 0.05, h * 0.14);
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(w * 0.87, h * 0.43, w * 0.05, h * 0.14);

      player.x = Math.max(0.08, Math.min(0.92, player.x + dir.x * 0.004));
      player.y = Math.max(0.10, Math.min(0.90, player.y + dir.y * 0.005));

      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(player.x * w, player.y * h, Math.max(10, w * 0.015), 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(enemy.x * w, enemy.y * h, Math.max(10, w * 0.015), 0, Math.PI * 2);
      ctx.fill();

      const bw = 64;
      const bx = enemy.x * w - bw / 2;
      const by = enemy.y * h - 22;
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(bx, by, bw, 7);
      ctx.fillStyle = enemy.hp < enemy.maxHp * 0.2 ? "#f97316" : "#ef4444";
      ctx.fillRect(bx, by, bw * (enemy.hp / enemy.maxHp), 7);

      beams = beams.filter((b) => b.ttl > 0);
      beams.forEach((b) => {
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
        ctx.stroke();
        b.ttl -= 1;
      });

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const openSheet = (title, html) => {
      document.getElementById("sheetTitle").textContent = title;
      document.getElementById("sheetBody").innerHTML = html;
      sheetBackdrop.classList.add("open");
    };
    document.getElementById("closeSheet").onclick = () => sheetBackdrop.classList.remove("open");

    document.getElementById("dragonBtn").onclick = () => {
      openSheet("5 Rồng Nguyên Tố & Rồng Hắc Ám", `
        <p>5 Rồng Nguyên Tố xuất hiện ngẫu nhiên; đủ 3 Rồng sẽ hóa thành <b>Rồng Hắc Ám</b>.</p>
        <p style="margin-top:8px;">Bùa Rồng Hắc Ám chỉ kết liễu ngay lập tức khi có <b>sát thương tướng đích</b> làm/khi mục tiêu dưới 20% máu.</p>
        <div style="margin-top:12px;">
          <button class="btn btn-gold" id="toggleBuff">${appState.darkDragonBuff ? "Tắt Bùa Rồng Hắc Ám" : "Kích Hoạt Bùa Rồng Hắc Ám (3/3)"}</button>
        </div>
      `);
      setTimeout(() => {
        const btn = document.getElementById("toggleBuff");
        if (btn) {
          btn.onclick = () => {
            appState.darkDragonBuff = !appState.darkDragonBuff;
            appState.dragonCount = appState.darkDragonBuff ? 3 : 0;
            persist();
            sheetBackdrop.classList.remove("open");
          };
        }
      }, 0);
    };

    document.getElementById("rankModalBtn").onclick = () => {
      openSheet("13 Bậc Đấu Hạng", `
        <p>Mỗi bậc có 4 bậc nhỏ (Bậc 4 → Bậc 3 → Bậc 2 → Bậc 1), mỗi bậc cần 5 sao:</p>
        <p style="margin-top:8px; color:#fbbf24;">${RANKS.join(" → ")}</p>
      `);
    };

    document.getElementById("exportGuideBtn").onclick = () => {
      openSheet("Đóng Gói Ứng Dụng — " + APP_TITLE, `
        <p>Gói đã gồm <b>manifest.webmanifest</b>, <b>sw.js</b> (offline), biểu tượng và <b>capacitor.config.json</b> (<code>com.daichienmanga.moba</code>).</p>
        <pre>npm init -y && npm install @capacitor/core @capacitor/cli @capacitor/android
mkdir -p www && cp index.html manifest.webmanifest sw.js icon-192.svg icon-512.svg www/
npx cap init "${APP_TITLE}" "com.daichienmanga.moba" --web-dir=www
npx cap add android</pre>
      `);
    };

    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    document.getElementById("installAppBtn").onclick = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else if (document.documentElement.requestFullscreen) {
        try {
          await document.documentElement.requestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape").catch(() => {});
          }
        } catch (_) {}
      }
    };

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    renderMeta();
  </script>
</body>
</html>
